<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Kirish</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f6;font-family:"Segoe UI",Arial,sans-serif;color:#17344a}
    .login{width:min(390px,calc(100% - 32px));background:white;border:1px solid #e1e9ed;border-radius:12px;padding:28px;box-shadow:0 18px 50px #102b4620}
    .mark{width:52px;height:52px;margin:0 auto 12px;border-radius:12px;background:#173e5b;color:#a6dadd;display:grid;place-items:center;font-size:26px}.brand{text-align:center;font-weight:800;letter-spacing:1px}.brand small{display:block;margin-top:5px;color:#83949f;font-size:9px;letter-spacing:2px}
    h1{font-size:20px;text-align:center;margin:24px 0 18px}label{display:block;font-size:11px;font-weight:700;margin-top:12px}input{width:100%;height:44px;border:1px solid #dce6ea;border-radius:6px;padding:0 12px;margin-top:7px;font:12px inherit}button{width:100%;height:44px;border:0;border-radius:6px;background:#173e5b;color:white;font-weight:800;margin-top:18px;cursor:pointer}.back{text-align:center;margin-top:14px}.back a{font-size:11px;color:#4d899d;text-decoration:none}
  </style>
</head>
<body>
  <main class="login">
    <div class="mark">+</div><div class="brand">BIOTIBBIYOT<small>ADMIN PANEL</small></div>
    <h1>Hisobingizga kiring</h1>
    <p id="loginError" hidden style="color:#b43e3e;font-size:12px;text-align:center">Login yoki parol noto‘g‘ri.</p>
    <form action="/admin/login" method="post">
      <label>Login<input name="username" autocomplete="username" required></label>
      <label>Parol<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Kirish</button>
    </form>
    <div class="back"><a href="/">← Asosiy sahifaga qaytish</a></div>
  </main>
  <script>if(new URLSearchParams(location.search).has("error"))document.getElementById("loginError").hidden=false;</script>
</body>
</html>
